[project]
name = "kb-code-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LaoBeiZi", email = "3143884180@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12",
]

[project.scripts]
kb-code-review = "kb_code_review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
